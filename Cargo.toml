[package]
name = "gbtracker"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
iced = { version = "0.14", features = ["svg", "advanced", "tokio", "lazy"] }
lucide-iced = "0.4"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "sync", "time", "macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.27.0"
