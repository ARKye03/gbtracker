[package]
name = "gbtracker"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
iced = { version = "0.14", features = ["svg", "advanced", "tokio", "lazy", "markdown"] }
lucide-iced = "0.4"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "sync", "time", "macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
redundant_clone = "warn"
needless_pass_by_value = "warn"
large_types_passed_by_value = "warn"
redundant_closure_for_method_calls = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
unchecked_time_subtraction = "warn"
implicit_clone = "warn"
needless_collect = "warn"
